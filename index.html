<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConf 2026 Landing Page Design</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Navber start -->
    
    <header class="navbar container">
        <div class="logo">
            <img src="./assets/logo.png" alt="DevConf 2026 Logo" class="logo-image">
        </div>

        <nav class="nav-links">
            <a href="">Speakers</a>
            <a href="">Schedule</a>
            <a href="">Tracks</a>
            <a href="">Venue</a>
            <a href="">Blog</a>
        </nav>

        <button class="common-btn">Register Now</button>
    </header><hr>
    <!-- Navber end -->
    <!-- Hero section start -->
    <section class="hero-section">
        <div class="hero-content container">
            <h1>Code. <span>Connect</span>. Create</h1>
            <p>Join 4,000+ engineers, founders, and builders at the premier developer conference of 2026. Three days of cutting-edge talks, hands-on workshops, and meaningful connections.</p>
            <button class="common-btn hero-btn">Register Now</button>
        </div>
       

    </section>

    <!-- Hero section end -->
    
</body>
</html>
